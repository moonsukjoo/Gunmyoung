name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "코드 체크아웃"
        uses: actions/checkout@v4

      - name: "Node.js 설정 (버전 22)"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "의존성 설치"
        run: |
          npm install
          npm install @capacitor/assets @capacitor/cli @capacitor/android

      - name: "웹 프로젝트 빌드"
        run: npm run build

      - name: "Capacitor 프로젝트 설정"
        run: |
          npx cap init "건명기업 HRM" "com.gunmyoung.app" --web-dir dist || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: "앱 에셋 준비 (아이콘 및 스플래시)"
        run: |
          mkdir -p assets
          cp public/company_logo.png assets/icon.png
          cp public/company_logo.png assets/icon-only.png
          cp public/company_logo.png assets/icon-foreground.png
          cp public/company_logo.png assets/icon-background.png
          
          if [ -f "assets/splash.png" ]; then
            echo "Using custom splash.png"
            cp assets/splash.png assets/splash-dark.png
          else
            cp public/company_logo.png assets/splash.png
            cp public/company_logo.png assets/splash-dark.png
          fi

      - name: "안드로이드 네이티브 에셋 생성"
        run: npx -y @capacitor/assets generate --android --assetPath assets

      - name: "Capacitor 싱크 및 리소스 동기화"
        run: npx cap sync android

      - name: "중복 클래스, 빌드 에러 및 파일 프로바이더 경로 보강"
        run: |
          echo "configurations.all { resolutionStrategy { force 'androidx.core:core:1.13.1'; force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20'; force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'; force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2' } }" >> android/app/build.gradle
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          if [ -f "android/variables.gradle" ]; then
            sed -i "s/kotlin_version = .*/kotlin_version = '2.2.20'/g" android/variables.gradle || true
            sed -i "s/kotlinxCoroutinesVersion = .*/kotlinxCoroutinesVersion = '1.10.2'/g" android/variables.gradle || true
          fi
          if [ -f "android/app/src/main/res/xml/file_paths.xml" ]; then
            sed -i 's|</paths>|    <cache-path name="cache" path="." />\n    <files-path name="files" path="." />\n    <external-path name="my_external_path" path="." />\n    <root-path name="root" path="." />\n</paths>|g' android/app/src/main/res/xml/file_paths.xml || true
          fi

      - name: "Java JDK 21 설정"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: "안드로이드 APK 빌드"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: "완성된 APK 업로드"
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gun-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
