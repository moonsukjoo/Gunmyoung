name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # GitHub Actions cache expires after 7 days of non-use; refresh signing keystore every 5 days without building a release
    - cron: '0 4 */5 * *'

permissions:
  contents: write

jobs:
  keepalive-keystore:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: "서명 키스토어 캐시 복원"
        uses: actions/cache/restore@v4
        with:
          path: ~/.gunmyoung-signing
          key: gunmyoung-signing-v2-${{ github.run_id }}
          restore-keys: |
            gunmyoung-signing-v2-

      - name: "키스토어 파일 존재 확인"
        id: check_keystore
        run: |
          if [ -f "$HOME/.gunmyoung-signing/gunmyoung-debug.keystore" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "서명 키스토어 캐시 유지 저장"
        if: steps.check_keystore.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.gunmyoung-signing
          key: gunmyoung-signing-v2-${{ github.run_id }}

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: "코드 체크아웃"
        uses: actions/checkout@v4

      - name: "Node.js 설정 (버전 22)"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "의존성 설치"
        run: |
          npm install
          npm install @capacitor/assets @capacitor/cli @capacitor/android

      - name: "웹 프로젝트 빌드"
        run: npm run build

      - name: "Capacitor 프로젝트 설정"
        run: |
          npx cap init "건명기업 HRM" "com.gunmyoung.app" --web-dir dist || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: "앱 에셋 준비 (아이콘 및 스플래시)"
        run: |
          mkdir -p assets
          cp public/company_logo.png assets/icon.png
          cp public/company_logo.png assets/icon-only.png
          cp public/company_logo.png assets/icon-foreground.png
          cp public/company_logo.png assets/icon-background.png

          if [ -f "assets/splash.png" ]; then
            echo "Using custom splash.png"
            cp assets/splash.png assets/splash-dark.png
          else
            cp public/company_logo.png assets/splash.png
            cp public/company_logo.png assets/splash-dark.png
          fi

      - name: "안드로이드 네이티브 에셋 생성"
        run: npx -y @capacitor/assets generate --android --assetPath assets

      - name: "Capacitor 싱크 및 리소스 동기화"
        run: npx cap sync android

      - name: "Java JDK 21 설정"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: "안드로이드 고정 서명 키스토어 캐시 복원"
        uses: actions/cache/restore@v4
        with:
          path: ~/.gunmyoung-signing
          key: gunmyoung-signing-v2-${{ github.run_id }}
          restore-keys: |
            gunmyoung-signing-v2-

      - name: "안드로이드 고정 서명 키스토어 준비"
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGN_DIR="$HOME/.gunmyoung-signing"
          mkdir -p "$SIGN_DIR"

          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ]; then
            KEYSTORE_FILE="$SIGN_DIR/gunmyoung-release.keystore"
            echo "$SECRET_KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
            KEY_PASS="${SECRET_KEY_PASS:-$SECRET_STORE_PASS}"
            echo "SIGNING_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "USE_SECRET_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Using GitHub Secret release keystore"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$SECRET_STORE_PASS" | grep -E "Alias|SHA256" || true
          else
            KEYSTORE_FILE="$SIGN_DIR/gunmyoung-debug.keystore"
            if [ ! -f "$KEYSTORE_FILE" ]; then
              echo "Generating persistent Gunmyoung signing keystore (first run)..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_FILE" \
                -storetype PKCS12 \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10950 \
                -dname "CN=Gunmyoung HRM, O=Gunmyoung, C=KR"
            else
              echo "Restored existing Gunmyoung signing keystore from cache"
            fi
            echo "SIGNING_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "USE_SECRET_KEYSTORE=false" >> "$GITHUB_ENV"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass android | grep -E "Alias|SHA256" || true
          fi

      - name: "안드로이드 고정 서명 키스토어 캐시 저장"
        if: env.USE_SECRET_KEYSTORE != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.gunmyoung-signing
          key: gunmyoung-signing-v2-${{ github.run_id }}

      - name: "빌드 버전 정보 계산"
        run: |
          RUN_NUM="${{ github.run_number }}"
          echo "APP_VERSION_CODE=$((100 + RUN_NUM))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.0.${RUN_NUM}" >> "$GITHUB_ENV"

      - name: "네이티브 플러그인, 버전 코드 및 서명 패치"
        run: |
          node native-android/scripts/patch-android.mjs
          cat android/app/src/main/AndroidManifest.xml

      - name: "중복 클래스, 빌드 에러 및 파일 프로바이더 경로 보강"
        run: |
          echo "configurations.all { resolutionStrategy { force 'androidx.core:core:1.13.1'; force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20'; force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'; force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2' } }" >> android/app/build.gradle
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          if [ -f "android/variables.gradle" ]; then
            sed -i "s/kotlin_version = .*/kotlin_version = '2.2.20'/g" android/variables.gradle || true
            sed -i "s/kotlinxCoroutinesVersion = .*/kotlinxCoroutinesVersion = '1.10.2'/g" android/variables.gradle || true
          fi
          if [ -f "android/app/src/main/res/xml/file_paths.xml" ]; then
            sed -i 's|</paths>|    <cache-path name="cache" path="." />\n    <files-path name="files" path="." />\n    <external-path name="my_external_path" path="." />\n    <root-path name="root" path="." />\n</paths>|g' android/app/src/main/res/xml/file_paths.xml || true
          fi

      - name: "안드로이드 APK 빌드"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: "자동 업데이트 릴리스 파일 생성"
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/gunyoung-hrm-latest.apk
          cat <<EOF > release-assets/version.json
          {
            "versionCode": ${{ env.APP_VERSION_CODE }},
            "versionName": "${{ env.APP_VERSION_NAME }}",
            "apkFileName": "gunyoung-hrm-latest.apk",
            "builtAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: "GitHub Release 자동 배포 (원터치 앱 업데이트용)"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: 건명기업 HRM v${{ env.APP_VERSION_NAME }}
          body: |
            자동 빌드된 최신 안드로이드 APK입니다.
            - Version Name: ${{ env.APP_VERSION_NAME }}
            - Version Code: ${{ env.APP_VERSION_CODE }}
          make_latest: true
          files: |
            release-assets/gunyoung-hrm-latest.apk
            release-assets/version.json

      - name: "완성된 APK 업로드"
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gun-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk


