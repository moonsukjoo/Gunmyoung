<!doctype html>
<html lang="ko" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/company_logo.png" />
    <link rel="apple-touch-icon" href="/company_logo.png" />
    <title>건명 통합관리 시스템</title>
    <script>
      (function () {
        var GUARD_KEY = 'boot_chunk_reload_at';
        var WATCHDOG_MS = 8500;
        var shown = false;

        function hasMountedUI() {
          var root = document.getElementById('root');
          return !!(window.__APP_BOOT_MOUNTED__ || (root && root.children && root.children.length > 0));
        }

        function clearCachesAndReload() {
          try { sessionStorage.removeItem(GUARD_KEY); } catch (e) {}
          var tasks = [];
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
          } catch (e) {}
          try {
            if (window.caches && caches.keys) {
              tasks.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) {}
          Promise.all(tasks).catch(function () {}).finally(function () {
            try {
              var url = new URL(window.location.href);
              url.searchParams.set('_cb', String(Date.now()));
              window.location.replace(url.toString());
            } catch (e) {
              window.location.reload();
            }
          });
        }

        function tryGuardedReload() {
          try {
            var last = Number(sessionStorage.getItem(GUARD_KEY) || '0');
            var now = Date.now();
            if (!last || now - last > 15000) {
              sessionStorage.setItem(GUARD_KEY, String(now));
              window.location.reload();
              return true;
            }
          } catch (e) {}
          return false;
        }

        function showPreBootRecovery(title, detail) {
          if (shown || hasMountedUI()) return;
          if (document.getElementById('boot-recovery-overlay')) return;
          shown = true;
          var mount = function () {
            if (hasMountedUI() || document.getElementById('boot-recovery-overlay')) return;
            var el = document.createElement('div');
            el.id = 'boot-recovery-overlay';
            el.style.cssText = 'position:fixed;inset:0;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px;z-index:99999;font-family:system-ui,-apple-system,sans-serif;';
            var box = document.createElement('div');
            box.style.cssText = 'max-width:420px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(15,23,42,0.12);text-align:center;';
            var h = document.createElement('h2');
            h.style.cssText = 'margin:0 0 8px;font-size:18px;font-weight:800;color:#0f172a;';
            h.textContent = title || '화면을 불러오지 못했습니다';
            var p = document.createElement('p');
            p.style.cssText = 'margin:0 0 16px;font-size:13px;line-height:1.5;color:#475569;word-break:break-word;';
            p.textContent = detail || '모듈 로딩 지연 또는 캐시 불일치가 발생했습니다. 아래 버튼을 눌러 다시 불러와 주세요.';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.style.cssText = 'width:100%;padding:12px 18px;background:#2563eb;color:#ffffff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;';
            btn.textContent = '캐시 초기화 후 다시 불러오기';
            btn.onclick = clearCachesAndReload;
            box.appendChild(h);
            box.appendChild(p);
            box.appendChild(btn);
            el.appendChild(box);
            (document.body || document.documentElement).appendChild(el);
          };
          if (document.body) mount();
          else document.addEventListener('DOMContentLoaded', mount, { once: true });
        }

        window.__APP_BOOT_WATCHDOG__ = window.setTimeout(function () {
          if (!hasMountedUI()) {
            if (!tryGuardedReload()) {
              showPreBootRecovery(
                '화면 초기화가 지연되고 있습니다',
                '네트워크 또는 브라우저 캐시 문제로 앱이 시작되지 않았습니다.'
              );
            }
          }
        }, WATCHDOG_MS);

        window.addEventListener('error', function (ev) {
          if (hasMountedUI()) return;
          var t = ev && ev.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            var src = t.src || t.href || '';
            if (src && !tryGuardedReload()) {
              showPreBootRecovery('리소스 로드 오류', '필수 스크립트를 불러오지 못했습니다: ' + src);
            }
            return;
          }
          var msg = (ev && ev.message) || '';
          if (msg && msg.indexOf('ResizeObserver') === -1) {
            if (!tryGuardedReload()) {
              showPreBootRecovery('초기화 스크립트 오류', msg);
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function (ev) {
          if (hasMountedUI()) return;
          var reason = ev && ev.reason;
          var msg = String((reason && reason.message) || reason || '');
          if (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('Outdated Optimize Dep') !== -1 ||
            msg.indexOf('does not provide an export named') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1
          ) {
            if (!tryGuardedReload()) {
              showPreBootRecovery('모듈 버전 불일치', msg);
            }
          }
        });
      })();
    </script>
  </head>
  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
